<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Промокоды и скидки — выгодные предложения</title>

<meta name="description" content="Скидки и выгодные предложения на популярные бренды AliExpress. Xiaomi, OnePlus, Realme, Honor, Dreame, Roborock и другие.">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    background:#f5f6f8;
    color:#15171b;
}

/* HEADER */

.header{
    background:#fff;
    border-bottom:1px solid #e9eaed;
    position:sticky;
    top:0;
    z-index:100;
}

.header-inner{
    max-width:1180px;
    margin:auto;
    padding:14px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    text-decoration:none;
    color:#111;
}

.logo-icon{
    width:40px;
    height:40px;
    border-radius:12px;
    background:linear-gradient(135deg,#ff3030,#ff6a00);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    font-weight:900;
}

.logo-title{
    font-size:17px;
    font-weight:800;
}

.logo-sub{
    font-size:11px;
    color:#858993;
}

.telegram-top{
    background:#17191d;
    color:#fff;
    text-decoration:none;
    padding:10px 15px;
    border-radius:10px;
    font-size:13px;
    font-weight:700;
}

/* HERO */

.hero{
    background:
        radial-gradient(circle at 10% 20%,rgba(255,55,45,.12),transparent 35%),
        radial-gradient(circle at 90% 30%,rgba(255,130,0,.10),transparent 35%),
        #fff;
    border-bottom:1px solid #e9eaed;
}

.hero-inner{
    max-width:1180px;
    margin:auto;
    padding:65px 20px 55px;
    text-align:center;
}

.hero-label{
    display:inline-flex;
    align-items:center;
    gap:7px;
    background:#fff0ee;
    color:#ed342b;
    border:1px solid #ffd9d5;
    border-radius:30px;
    padding:8px 14px;
    font-size:12px;
    font-weight:800;
}

.hero h1{
    font-size:clamp(38px,6vw,64px);
    line-height:1;
    letter-spacing:-2.8px;
    margin:20px auto 15px;
    max-width:800px;
}

.hero h1 span{
    color:#ef332b;
}

.hero-text{
    max-width:650px;
    margin:auto;
    color:#6e737d;
    font-size:17px;
    line-height:1.55;
}

.hero-button{
    display:inline-block;
    margin-top:25px;
    background:linear-gradient(135deg,#ff3430,#ff641b);
    color:#fff;
    text-decoration:none;
    padding:15px 24px;
    border-radius:12px;
    font-size:14px;
    font-weight:800;
    box-shadow:0 12px 30px rgba(255,60,35,.22);
    transition:.2s;
}

.hero-button:hover{
    transform:translateY(-2px);
}

/* MAIN */

.main{
    max-width:1180px;
    margin:auto;
    padding:40px 20px 70px;
}

.section-head{
    display:flex;
    justify-content:space-between;
    align-items:end;
    gap:20px;
    margin-bottom:20px;
}

.section-title{
    font-size:28px;
    letter-spacing:-1px;
}

.section-subtitle{
    color:#8a8f98;
    font-size:13px;
    margin-top:5px;
}

/* SEARCH */

.search{
    width:280px;
    border:1px solid #dddfe4;
    background:#fff;
    border-radius:12px;
    padding:12px 15px;
    font-size:14px;
    outline:none;
}

.search:focus{
    border-color:#ff5146;
    box-shadow:0 0 0 3px rgba(255,80,70,.08);
}

/* CATEGORIES */

.category{
    margin-top:38px;
}

.category-title{
    display:flex;
    align-items:center;
    gap:9px;
    font-size:19px;
    margin-bottom:14px;
}

.category-title span{
    color:#8b9098;
    font-size:12px;
    font-weight:500;
}

/* BRAND GRID */

.brand-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:13px;
}

.brand{
    display:block;
    text-decoration:none;
    color:#15171b;
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:16px;
    padding:18px;
    min-height:145px;
    transition:.2s;
    position:relative;
    overflow:hidden;
}

.brand:hover{
    transform:translateY(-4px);
    border-color:#ffaaa5;
    box-shadow:0 12px 30px rgba(30,30,30,.08);
}

.brand-logo{
    height:48px;
    width:48px;
    border-radius:13px;
    background:#f1f2f4;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:900;
    font-size:17px;
    margin-bottom:14px;
}

.brand-name{
    font-size:16px;
    font-weight:800;
}

.brand-description{
    color:#858a94;
    font-size:11px;
    line-height:1.35;
    margin-top:5px;
}

.brand-arrow{
    position:absolute;
    right:14px;
    bottom:14px;
    width:27px;
    height:27px;
    border-radius:50%;
    background:#f3f4f6;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:14px;
}

/* TELEGRAM BLOCK */

.telegram-block{
    margin:55px 0 20px;
    background:
        radial-gradient(circle at 90% 10%,rgba(255,255,255,.18),transparent 30%),
        linear-gradient(135deg,#17191d,#272b32);
    color:#fff;
    border-radius:24px;
    padding:32px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:25px;
    overflow:hidden;
    position:relative;
}
